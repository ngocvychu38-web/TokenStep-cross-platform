name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  cloud-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: tools/cloud-tests
      - run: npm test
        working-directory: tools/cloud-tests
  rust:
    strategy:
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build collector release
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release -p tokenstep-agent
      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: ./script/windows/package-windows.ps1
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        run: ./script/windows/test-windows-package.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: TokenStep-Agent-0.1.0-windows-x64-installer
          path: release/windows/TokenStep-Agent-0.1.0-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tokenstep-agent-${{ matrix.os }}
          path: |
            target/release/tokenstep-agent
            target/release/tokenstep-agent.exe

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift tests
        run: swift test --package-path TokenStepSwift
      - name: Run usage collector fixture checks
        run: ./script/test_ccswitch_proxy_collector.sh
      - name: Run Codex cumulative accounting checks
        run: ./script/test_codex_cumulative_collector.sh
      - name: Run accounting migration checks
        run: ./script/test_usage_recalibration_migration.sh
      - name: Run update rollback checks
        run: ./script/test_update_helper_transaction.sh
      - name: Run freshness model checks
        run: ./script/test_freshness_model.sh
      - name: Run project extraction checks
        run: ./script/test_project_extraction.sh
      - name: Run agent sources checks
        run: ./script/test_agent_sources.sh
      - name: Run device sync checks
        run: ./script/test_device_sync.sh
      - name: Run cloud snapshot checks
        run: ./script/test_cloud_snapshot.sh
      - name: Render settings cards check
        run: ./script/render_settings_cards.sh
      - name: Build TokenStep
        run: ./script/build_swiftui_and_run.sh --no-launch
